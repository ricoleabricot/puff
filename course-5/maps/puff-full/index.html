<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full Puff map</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#FFF4EE;color:#3A2A24;font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:10px}
.wrap{max-width:700px;margin:0 auto}
.hero{background:linear-gradient(135deg,#FFB59C,#F27E5E);color:#fff;border-radius:16px;padding:8px 14px;box-shadow:0 6px 18px rgba(242,126,94,.3);display:flex;gap:4px 12px;align-items:baseline;flex-wrap:wrap}
.hero h1{font-size:19px;margin:0;font-weight:800;line-height:1.15}
.hero p{margin:1px 0 0;font-weight:700;font-size:14px;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #3A2A24;outline-offset:2px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar button{border:0;border-radius:12px;padding:0 10px;font-weight:700;font-size:14px}
.play{background:linear-gradient(135deg,#F58D6F,#DF5F3F);color:#fff;box-shadow:0 3px 8px rgba(223,95,63,.35)}
.play:disabled{opacity:.45;cursor:default}
.chip{background:#fff;box-shadow:inset 0 0 0 2px #F0CDBE}
.chip[aria-pressed=true]{background:#3A2A24;color:#fff;box-shadow:none}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(120,60,40,.1);padding:6px;margin-top:8px}
svg{display:block;width:100%;height:auto;overflow:visible}
.cap{min-height:40px;margin:8px 0 0;padding:8px 12px;border-radius:12px;background:#fff;font-weight:600;box-shadow:0 2px 8px rgba(120,60,40,.08)}
.frame{fill:#FFF7F2;stroke:#F0CDBE;stroke-width:1.5;stroke-dasharray:5 4}
.ftxt{font-size:12px;font-weight:700;fill:#9A6B5A}
.box rect{fill:#fff;stroke:#F0CDBE;stroke-width:2}
.box .t{font-size:13px;font-weight:800;fill:#3A2A24}
.box .s{font-size:11px;fill:#6E5146}
.box.dead rect{fill:#FDECEA;stroke:#E5534B}
.box.new rect{fill:#E6F6EC;stroke:#3BAA6E}
.box.hot rect{stroke:#F27E5E;stroke-width:3}
.box,.edge{transition:opacity .25s}
.off{opacity:.18}
.gone{display:none}
.edge{stroke:#DF9A82;stroke-width:2;fill:none}
#dot{fill:#DF5F3F;stroke:#fff;stroke-width:2}
@media (max-width:520px){.bar button{font-size:13px;padding:0 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><h1>Full Puff</h1><p>Press a button and follow the dot.</p></div>
  <div class="bar" id="plays" role="group" aria-label="Play a flow"></div>
  <div class="bar" id="chips" role="group" aria-label="Focus on one part"></div>
  <div class="card"><svg id="map" role="img" aria-label="Map of Puff: users, CloudFront, frontend bucket, load balancer, Auto Scaling group across two zones, database, and the upload flow"></svg></div>
  <div class="cap" id="cap" role="status" aria-live="polite">Pick a flow to play.</div>
</div>
<script>
const EB='https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/';
const em=n=>EB+encodeURIComponent(n)+'/3D/'+n.toLowerCase().replace(/ /g,'_')+'_3d.png';
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg';
const N={
 users:{t:'Users',s:'browser, phone',e:'Busts in silhouette',g:'edge api'},
 cdn:{t:'CloudFront',s:'edge copies',e:'Globe with meridians',g:'edge'},
 front:{t:'Frontend bucket',s:'puff-frontend',e:'Bucket',g:'edge'},
 alb:{t:'Load balancer',s:'puff-alb',e:'Balance scale',g:'api'},
 s1:{t:'Server',s:'',e:'Desktop computer',g:'api',sm:1},
 s2:{t:'Server',s:'',e:'Desktop computer',g:'api',sm:1},
 s3:{t:'Server',s:'',e:'Desktop computer',g:'api',sm:1,ex:1},
 s4:{t:'Server',s:'',e:'Desktop computer',g:'api',sm:1,ex:1},
 db:{t:'Database',s:'puff-db, 1 zone',e:'Card file box',g:'api'},
 up:{t:'Uploads bucket',s:'puff-uploads',e:'Inbox tray',g:'up'},
 fn:{t:'Function',s:'puff-upload-notifier',e:'High voltage',g:'up'},
 top:{t:'Alert topic',s:'puff-alerts',e:'Megaphone',g:'up'},
 mail:{t:'Email',s:'your inbox',e:'E-mail',g:'up'}
};
const E=[['users','cdn'],['cdn','front'],['users','alb'],['alb','grp'],['grp','db'],['up','fn'],['fn','top'],['top','mail']];
const meta=k=>N[k]||{g:'api'};
const L={
 wide:{w:680,h:302,bh:50,sh:36,boxes:{
  users:[2,92,124],cdn:[160,6,140],front:[336,6,166],alb:[160,110,132],
  s1:[316,114,102],s2:[424,114,102],s3:[316,158,102],s4:[424,158,102],
  db:[556,110,122],up:[6,240,150],fn:[174,240,164],top:[356,240,150],mail:[524,240,150]},
  frames:[[308,70,226,130,'Auto Scaling group · puff-asg'],[0,214,680,84,'When a file lands']],
  zones:[[367,'Zone A'],[475,'Zone B']],zy:104},
 tall:{w:340,h:590,bh:50,sh:36,boxes:{
  users:[95,2,150],cdn:[6,76,158],alb:[176,76,158],front:[6,146,158],
  s1:[56,240,132],s2:[196,240,132],s3:[56,284,132],s4:[196,284,132],
  db:[90,352,160],up:[6,454,158],fn:[176,454,158],top:[176,522,158],mail:[6,522,158]},
  frames:[[46,198,292,132,'Auto Scaling group · puff-asg'],[0,428,340,160,'When a file lands']],
  zones:[[122,'Zone A'],[262,'Zone B']],zy:232}
};
let lay,rects={},focus='all',busy=false,state={};
function freshState(){state={s3:false,s4:false,dead:null,fresh:null,hot:null}}
function rect(k){const[x,y,w]=lay.boxes[k],h=N[k].sm?lay.sh:lay.bh;return{x,y,w,h,cx:x+w/2,cy:y+h/2}}
function clip(a,b){ // where the line from a's centre to b's centre leaves a
  const dx=b.cx-a.cx,dy=b.cy-a.cy,tx=dx?(a.w/2+3)/Math.abs(dx):9,ty=dy?(a.h/2+3)/Math.abs(dy):9,t=Math.min(tx,ty);
  return{x:a.cx+dx*t,y:a.cy+dy*t};
}
function pts(a,b){const A=rects[a],B=rects[b];return[clip(A,B),clip(B,A)]}
function el(n,at,par){const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);par&&par.appendChild(e);return e}
function draw(){
  const W=$('#map').parentNode.clientWidth;lay=W<520?L.tall:L.wide;
  const svg=$('#map');svg.innerHTML='';svg.setAttribute('viewBox','0 0 '+lay.w+' '+lay.h);
  const defs=el('defs',{},svg),mk=el('marker',{id:'ah',markerWidth:7,markerHeight:7,refX:6,refY:3.5,orient:'auto'},defs);el('path',{d:'M0,0 L7,3.5 L0,7 Z',fill:'#DF9A82'},mk);
  for(const k in N)rects[k]=rect(k);
  {const[x,y,w,h]=lay.frames[0];rects.grp={x,y,w,h,cx:x+w/2,cy:y+h/2}}
  lay.frames.forEach(f=>{el('rect',{class:'frame'+(f===lay.frames[0]?' apiz':''),x:f[0],y:f[1],width:f[2],height:f[3],rx:12},svg);const t=el('text',{class:'ftxt'+(f===lay.frames[0]?' apiz':''),x:f[0]+10,y:f[1]+16},svg);t.textContent=f[4]});
  lay.zones.forEach(z=>{const t=el('text',{class:'ftxt apiz',x:z[0],y:lay.zy,'text-anchor':'middle'},svg);t.textContent=z[1]});
  E.forEach(([a,b])=>{const[p,q]=pts(a,b);el('line',{class:'edge','data-a':a,'data-b':b,x1:p.x,y1:p.y,x2:q.x,y2:q.y,'marker-end':'url(#ah)'},svg)});
  for(const k in N){
    const n=N[k],r=rects[k],g=el('g',{class:'box','data-k':k},svg);
    el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:12},g);
    const sz=n.sm?22:26;
    const im=el('image',{href:em(n.e),x:r.x+6,y:r.cy-sz/2,width:sz,height:sz},g);im.addEventListener('error',()=>im.remove());
    const tx=r.x+sz+10;
    const t=el('text',{class:'t',x:tx,y:n.s?r.cy-2:r.cy+4.5},g);t.textContent=n.t;
    if(n.s){const s=el('text',{class:'s',x:tx,y:r.cy+13},g);s.textContent=n.s}
  }
  el('circle',{id:'dot',r:7,cx:-20,cy:-20,class:'gone'},svg);
  paint();
}
function paint(){
  document.querySelectorAll('.box').forEach(g=>{
    const k=g.dataset.k,n=N[k];
    g.classList.toggle('off',focus!=='all'&&!n.g.split(' ').includes(focus));
    g.classList.toggle('gone',!!n.ex&&!state[k]);
    g.classList.toggle('dead',state.dead===k);
    g.classList.toggle('new',state.fresh===k);
    g.classList.toggle('hot',state.hot===k);
  });
  document.querySelectorAll('.edge').forEach(l=>{
    const a=meta(l.dataset.a).g.split(' '),b=meta(l.dataset.b).g.split(' ');
    l.classList.toggle('off',focus!=='all'&&!(a.includes(focus)&&b.includes(focus)));
  });
  document.querySelectorAll('.apiz').forEach(e=>e.classList.toggle('off',focus!=='all'&&focus!=='api'));
}
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,still?Math.min(ms,500):ms));
function hop(a,b){return new Promise(res=>{
  const d=$('#dot');let p,q;
  const A=rects[a],B=rects[b];p={x:A.cx,y:A.cy};q={x:B.cx,y:B.cy};
  if(still){res();return}
  d.classList.remove('gone');const t0=performance.now(),T=620;
  const f=t=>{const u=Math.min(1,(t-t0)/T);d.setAttribute('cx',p.x+(q.x-p.x)*u);d.setAttribute('cy',p.y+(q.y-p.y)*u);u<1?requestAnimationFrame(f):(d.classList.add('gone'),res())};
  requestAnimationFrame(f);
})}
const say=t=>{$('#cap').textContent=t};
const set=o=>{Object.assign(state,o);paint()};
const FLOWS=[
 {k:'page',t:'▶ Open the page',f:'edge',run:async()=>{
  say('The browser asks CloudFront for the page.');await hop('users','cdn');await wait(250);
  say('No fresh copy? CloudFront reads the bucket.');await hop('cdn','front');await hop('front','cdn');await wait(250);
  say('CloudFront keeps a copy and answers.');await hop('cdn','users');await wait(500);
  say('The next visitor gets that copy, the bucket does nothing.');await hop('users','cdn');await hop('cdn','users');}},
 {k:'post',t:'▶ Post a message',f:'api',run:async()=>{
  say('The page calls the API through the load balancer.');await hop('users','alb');await wait(250);
  say('It picks a healthy server.');await hop('alb','s1');await wait(250);
  say('Every server uses the same database.');await hop('s1','db');await hop('db','s1');await wait(250);
  say('The answer goes back to the user.');await hop('s1','alb');await hop('alb','users');}},
 {k:'heal',t:'▶ A server dies',f:'api',run:async()=>{
  say('One server dies.');set({dead:'s2'});await wait(1100);
  say('The load balancer stops sending it traffic.');await hop('alb','s1');await hop('alb','s1');
  say('The group boots a new server.');await wait(1200);
  say('Two healthy servers again.');set({dead:null,fresh:'s2'});await wait(1200);set({fresh:null});}},
 {k:'rush',t:'▶ The 9:00 rush',f:'api',run:async()=>{
  say('The servers get busy.');set({hot:'alb'});await hop('alb','s1');await hop('alb','s2');
  say('The group adds servers, up to 4.');set({s3:true,fresh:'s3'});await wait(800);set({s4:true,fresh:'s4'});await wait(900);set({fresh:null,hot:null});
  say('Four servers share the load.');await hop('alb','s3');await hop('alb','s4');
  say('After the rush, back to 2.');await wait(1000);set({s3:false,s4:false});await wait(500);}},
 {k:'upload',t:'▶ Upload a file',f:'up',run:async()=>{
  say('A file lands in the uploads bucket.');set({hot:'up'});await wait(800);set({hot:null});
  say('That event starts the function.');await hop('up','fn');await wait(200);
  say('The function publishes to the alert topic.');await hop('fn','top');await wait(200);
  say('The topic sends you the email.');await hop('top','mail');}}
];
const CH=[['all','All'],['edge','Frontend'],['api','API'],['up','Uploads']];
function chips(){$('#chips').innerHTML=CH.map(c=>'<button class="chip" aria-pressed="'+(focus===c[0])+'" data-c="'+c[0]+'">'+c[1]+'</button>').join('');
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{focus=b.dataset.c;chips();paint()})}
$('#plays').innerHTML=FLOWS.map(f=>'<button class="play" data-f="'+f.k+'">'+f.t+'</button>').join('');
document.querySelectorAll('.play').forEach(b=>b.onclick=async()=>{
  if(busy)return;busy=true;document.querySelectorAll('.play').forEach(x=>x.disabled=true);
  const f=FLOWS.find(x=>x.k===b.dataset.f);freshState();focus=f.f;chips();paint();
  await f.run();
  busy=false;document.querySelectorAll('.play').forEach(x=>x.disabled=false);b.focus({preventScroll:true});
});
freshState();chips();draw();
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!busy)draw()},150)});
</script>
</body>
</html>
