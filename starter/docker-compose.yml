services:
  floci:
    image: floci/floci:2.5.0
    container_name: floci
    network_mode: bridge
    ports:
      - "127.0.0.1:4566:4566"   # AWS API
      - "127.0.0.1:80:80"       # ALB listeners
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_NETWORK_SECURITY_GROUP_ENFORCEMENT_ENABLED: "true"
      FLOCI_SERVICES_IAM_ENFORCEMENT_ENABLED: "true"
      FLOCI_SERVICES_CLOUDFRONT_ALLOWED_PRIVATE_ORIGIN_HOSTS: "${ALB_ORIGINS:-none}"
      # This machine only: Floci accepts test/test and drives Docker, so never expose it to the network
      FLOCI_SERVICES_UI_BIND_ADDRESS: "127.0.0.1"
      FLOCI_SERVICES_EC2_PUBLISH_SECURITY_GROUP_PORTS: "false"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
