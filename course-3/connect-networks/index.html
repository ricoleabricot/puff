<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect the networks</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#FFF4EE;color:#3A2A24;font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:10px}
.wrap{max-width:700px;margin:0 auto}
.hero{background:linear-gradient(135deg,#FFB59C,#F27E5E);color:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(242,126,94,.3)}
.hero h1{font-size:19px;margin:0;font-weight:800;line-height:1.15}
.hero p{margin:2px 0 0;font-weight:700;font-size:14px;line-height:1.25}
.hero .em{width:42px;height:42px;flex:none}
.em{width:28px;height:28px;object-fit:contain;vertical-align:middle;flex:none}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(120,60,40,.1);padding:12px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #3A2A24;outline-offset:2px}
.btn{background:linear-gradient(135deg,#F58D6F,#DF5F3F);color:#fff;font-weight:800;border:0;border-radius:14px;padding:0 20px;box-shadow:0 3px 8px rgba(223,95,63,.35)}
.btn.ghost{background:#fff;color:#3A2A24;box-shadow:inset 0 0 0 2px #F0CDBE}
.btn:disabled{opacity:.45;cursor:default}
.fb{min-height:44px;margin:8px 0 0;padding:8px 12px;border-radius:12px;background:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(120,60,40,.08)}
.fb.ok{background:#E6F6EC;box-shadow:inset 0 0 0 2px #3BAA6E}
.fb.bad{background:#FDECEA;box-shadow:inset 0 0 0 2px #E5534B}
.ok-c{color:#237A4B}.bad-c{color:#C23B33}
.end{text-align:center;margin-top:10px}
.end h2{margin:0 0 4px;font-size:22px}
.end .score{font-size:18px;font-weight:800;margin:4px 0 6px}
.end .take{font-weight:700;margin:0 0 10px}
.end .em{width:56px;height:56px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sc{margin-top:8px}
.sc .tag{font-size:12px;font-weight:700;opacity:.7}
.sc .what{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;margin:4px 0 8px}
.sc .what .em{width:44px;height:44px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:#FFFAF7;border:2px solid #F2DDD3;border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:8px;text-align:left;min-height:56px}
.opt:hover:not(:disabled){border-color:#F27E5E;background:#FFF0E8}
.opt b{display:block;font-size:14px}
.opt small{display:block;font-size:12px;opacity:.75;line-height:1.2}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.opt.right{background:#DDF3E6;border-color:#3BAA6E}.opt.right .mk{color:#237A4B}
.opt.wrong{background:#FBDAD7;border-color:#E5534B}.opt.wrong .mk{color:#C23B33}
.opt:disabled{cursor:default;color:inherit}
.sc .btn{margin-top:8px;width:100%}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span id="heroEm"></span><div><h1>Connect the networks</h1><p>4 situations. Pick the tool that links the networks.</p></div></div>
  <div class="card sc" id="sc"></div>
  <div id="fb" class="fb" role="status" aria-live="polite">Pick a tool.</div>
  <div id="end" class="end card hide"></div>
</div>
<script>
const EB='https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/';
function em(name,chr,cls){
  const u=EB+encodeURIComponent(name)+'/3D/'+name.toLowerCase().replace(/ /g,'_')+'_3d.png';
  return '<img class="em '+(cls||'')+'" src="'+u+'" alt="'+chr+'" aria-hidden="true" onerror="this.replaceWith(document.createTextNode(this.alt))">';
}
const $=s=>document.querySelector(s);
function say(el,msg,kind){el.className='fb '+(kind||'');el.textContent=msg}
const T=[
 {k:'peer',l:'VPC peering',s:'a private road between two VPCs',e:['Bridge at night','🌉']},
 {k:'tgw',l:'Transit Gateway',s:'a roundabout everyone joins once',e:['Bus','🚌']},
 {k:'vpn',l:'Site-to-Site VPN',s:'an encrypted tunnel over the internet',e:['Locked with key','🔐']},
 {k:'dx',l:'Direct Connect',s:'a private physical cable into AWS',e:['Electric plug','🔌']}
];
const S=[
 {e:['Bar chart','📊'],t:'Puff\'s VPC and a new analytics VPC need to talk. Only those two.',a:'peer',
  w:'Two or three VPCs: peering is simple and free to set up, and its "doesn\'t chain" limit doesn\'t hurt yet.'},
 {e:['Office building','🏢'],t:'Ten VPCs across several accounts, plus an office, all need to reach each other.',a:'tgw',
  w:'With peering that\'s a web of links (45 for ten VPCs). A Transit Gateway takes one connection per network and keeps routing in one place.'},
 {e:['Hourglass not done','⏳'],t:'A company\'s office needs access to its AWS network this week.',a:'vpn',
  w:'A Site-to-Site VPN is up in about an hour, encrypted and cheap. Direct Connect takes weeks.'},
 {e:['Factory','🏭'],t:'A data center sends terabytes to AWS every day and needs steady speed.',a:'dx',
  w:'Direct Connect gives predictable speed and cheaper data at volume. Big companies keep a VPN as its backup.'}
];
let i,score,locked;
const sc=$('#sc'),fb=$('#fb'),endEl=$('#end');
$('#heroEm').innerHTML=em('Link','🔗');
function start(){i=0;score=0;endEl.classList.add('hide');sc.classList.remove('hide');fb.classList.remove('hide');show()}
function show(){
  locked=false;const s=S[i];
  sc.innerHTML='<div class="tag">Situation '+(i+1)+' of '+S.length+'</div><div class="what">'+em(s.e[0],s.e[1])+'<span>'+s.t+'</span></div>'+
   '<div class="opts">'+T.map(t=>'<button class="opt" data-k="'+t.k+'">'+em(t.e[0],t.e[1])+'<span><b>'+t.l+'</b><small>'+t.s+'</small></span><span class="mk"></span></button>').join('')+'</div>';
  say(fb,'Pick a tool.');
}
function pick(k){
  if(locked)return;locked=true;
  const s=S[i],ok=k===s.a;if(ok)score++;
  sc.querySelectorAll('.opt').forEach(b=>{b.disabled=true;
    if(b.dataset.k===s.a){b.classList.add('right');b.querySelector('.mk').textContent='✓'}
    else if(b.dataset.k===k){b.classList.add('wrong');b.querySelector('.mk').textContent='✗'}});
  say(fb,(ok?'✓ Yes! ':'✗ Not this one. ')+s.w,ok?'ok':'bad');
  sc.insertAdjacentHTML('beforeend','<button class="btn" id="nx">'+(i<S.length-1?'Next':'See my score')+'</button>');
  $('#nx').focus({preventScroll:true});
  $('#nx').onclick=()=>{i++;i<S.length?show():finish()};
}
function finish(){
  sc.classList.add('hide');fb.classList.add('hide');endEl.classList.remove('hide');
  endEl.innerHTML=em(score===S.length?'Trophy':'Party popper',score===S.length?'🏆':'🎉')+'<h2>Networks connected!</h2><div class="score">Score: '+score+' / '+S.length+'</div><p class="take">None of the four works with overlapping IP ranges. Plan your ranges first.</p><button class="btn" id="again">Play again</button>';
  $('#again').onclick=start;$('#again').focus();
}
sc.addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)pick(b.dataset.k)});
start();
</script>
</body>
</html>
