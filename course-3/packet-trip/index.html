<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packet trip: follow a request through Puff</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#FFF4EE;color:#3A2A24;font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:10px}
.wrap{max-width:700px;margin:0 auto}
.hero{background:linear-gradient(135deg,#FFB59C,#F27E5E);color:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(242,126,94,.3)}
.hero h1{font-size:19px;margin:0;font-weight:800;line-height:1.15}
.hero p{margin:2px 0 0;font-weight:700;font-size:14px;line-height:1.25}
.hero .em{width:42px;height:42px;flex:none}
.em{width:28px;height:28px;object-fit:contain;vertical-align:middle;flex:none}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(120,60,40,.1);padding:12px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #3A2A24;outline-offset:2px}
.btn{background:linear-gradient(135deg,#F58D6F,#DF5F3F);color:#fff;font-weight:800;border:0;border-radius:14px;padding:0 20px;box-shadow:0 3px 8px rgba(223,95,63,.35)}
.btn.ghost{background:#fff;color:#3A2A24;box-shadow:inset 0 0 0 2px #F0CDBE}
.btn:disabled{opacity:.45;cursor:default}
.fb{min-height:44px;margin:8px 0 0;padding:8px 12px;border-radius:12px;background:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(120,60,40,.08)}
.fb.ok{background:#E6F6EC;box-shadow:inset 0 0 0 2px #3BAA6E}
.fb.bad{background:#FDECEA;box-shadow:inset 0 0 0 2px #E5534B}
.ok-c{color:#237A4B}.bad-c{color:#C23B33}
.end{text-align:center;margin-top:10px}
.end h2{margin:0 0 4px;font-size:22px}
.end .score{font-size:18px;font-weight:800;margin:4px 0 6px}
.end .take{font-weight:700;margin:0 0 10px}
.end .em{width:56px;height:56px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.leg{margin-top:8px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.leg .em{width:26px;height:26px}
.map{margin-top:6px;display:flex;flex-direction:column;gap:6px}
.zone{border-radius:14px;padding:4px 8px 8px}
.zone>small{display:block;font-size:12px;font-weight:700;opacity:.75;margin:0 0 3px 2px}
.zone.net{background:#EEF3FB}
.vpc{background:#FFFAF7;box-shadow:inset 0 0 0 2px #F6DCCF;border-radius:16px;padding:6px;display:flex;flex-direction:column;gap:6px}
.zone.pub{background:#FFEDE4}.zone.priv{background:#ECEFF8}
.row{display:flex;gap:8px;justify-content:center}
.node{position:relative;flex:1;max-width:240px;background:#fff;border:0;border-radius:14px;box-shadow:0 3px 10px rgba(120,60,40,.12);display:flex;align-items:center;gap:8px;padding:4px 10px;text-align:left;min-height:48px;transition:transform .15s}
.node .em{width:30px;height:30px}
.node b{display:block;font-size:14px;line-height:1.1}
.node small{display:block;font-size:11.5px;opacity:.75;line-height:1.15}
.node:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 0 0 2px #F27E5E,0 4px 12px rgba(242,126,94,.3)}
.node.on{box-shadow:0 0 0 3px #3BAA6E}
.node.shake{animation:shake .35s;box-shadow:0 0 0 3px #E5534B}
.node .n{position:absolute;top:-7px;right:-5px;background:#3BAA6E;color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.trail{font-size:13px;margin-top:6px;text-align:center;opacity:.85;min-height:18px}
.vl{font-size:12px;font-weight:700;opacity:.75;margin:0 0 -4px 4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span id="heroEm"></span><div><h1>Packet trip</h1><p>Follow the packet. Tap the next stop, in order.</p></div></div>
  <div class="leg" id="leg"></div>
  <div class="map">
    <div class="zone net"><small>The internet</small><div class="row"><span id="n-browser"></span><span id="n-hub"></span></div></div>
    <div class="vpc">
      <small class="vl">puff-vpc</small>
      <div class="row"><span id="n-igw"></span></div>
      <div class="zone pub"><small>Public subnets</small><div class="row"><span id="n-alb"></span><span id="n-nat"></span></div></div>
      <div class="zone priv"><small>Private subnets</small><div class="row"><span id="n-api"></span><span id="n-db"></span></div></div>
    </div>
  </div>
  <div class="trail" id="trail"></div>
  <div id="fb" class="fb" role="status" aria-live="polite"></div>
  <div id="end" class="end card hide"></div>
</div>
<script>
const EB='https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/';
function em(name,chr,cls){
  const u=EB+encodeURIComponent(name)+'/3D/'+name.toLowerCase().replace(/ /g,'_')+'_3d.png';
  return '<img class="em '+(cls||'')+'" src="'+u+'" alt="'+chr+'" aria-hidden="true" onerror="this.replaceWith(document.createTextNode(this.alt))">';
}
const $=s=>document.querySelector(s);
function say(el,msg,kind){el.className='fb '+(kind||'');el.textContent=msg}
const N={
 browser:{l:'Browser',s:'a student on the board',e:['Laptop','💻']},
 hub:{l:'Docker Hub',s:'where images live',e:['Whale','🐋']},
 igw:{l:'Internet Gateway',s:'two-way gate',e:['Door','🚪']},
 alb:{l:'puff-alb',s:'load balancer',e:['Bellhop bell','🛎️']},
 nat:{l:'NAT gateway',s:'one-way exit',e:['Outbox tray','📤']},
 api:{l:'puff-api',s:'no public IP',e:['Gear','⚙️']},
 db:{l:'puff-db',s:'PostgreSQL',e:['File cabinet','🗄️']}
};
const LEGS=[
 {t:'Trip 1: a student posts a message',e:['Incoming envelope','📨'],path:['browser','igw','alb','api','db'],
  why:{igw:'The Internet Gateway is the VPC\'s two-way gate to the internet.',
   alb:'puff-alb sits in a public subnet, the only public door. puff-alb-sg allows port 80.',
   api:'The ALB forwards to puff-api on 8080 in a private subnet. puff-api-sg allows 8080 from puff-alb-sg.',
   db:'The API queries puff-db on 5432. The local route keeps it inside the VPC.'}},
 {t:'Trip 2: puff-api pulls its Docker image',e:['Package','📦'],path:['api','nat','igw','hub'],
  why:{nat:'The private route table sends 0.0.0.0/0 to the NAT gateway.',
   igw:'The NAT sits in a public subnet and leaves through the IGW with its own public IP.',
   hub:'Docker Hub sees the NAT\'s public IP. It can reply, but it can never start a conversation with the API.'}}
];
function wrong(leg,node){
  if(leg===0){
    if(node==='api')return'puff-api is in a private subnet with no public IP. Visitors only meet the ALB.';
    if(node==='db')return'puff-db only accepts 5432 from puff-api-sg, and nothing outside reaches a private subnet directly.';
    if(node==='nat')return'The NAT is a one-way exit. Nothing from the internet can come in through it.';
    if(node==='alb')return'The ALB is in the VPC. The packet has to come through the VPC\'s gate first.';
    if(node==='hub')return'Docker Hub isn\'t part of this trip.';
    return'Not that one. Where does the packet go next?';
  }
  if(node==='igw')return'A private subnet has no route to the IGW. Its 0.0.0.0/0 goes somewhere else first.';
  if(node==='hub')return'Not yet: the packet has to leave the VPC first.';
  if(node==='alb')return'The ALB receives visitors. It doesn\'t carry the API\'s outbound calls.';
  if(node==='db')return'The database isn\'t on the way out.';
  if(node==='browser')return'This trip goes to Docker Hub, not to a browser.';
  return'Not that one. Where does the packet go next?';
}
let leg,step,miss,mistakes,count,busy;
const fb=$('#fb'),endEl=$('#end');
$('#heroEm').innerHTML=em('Compass','🧭');
Object.keys(N).forEach(k=>{const n=N[k];$('#n-'+k).outerHTML='<button class="node" data-k="'+k+'" aria-label="'+n.l+', '+n.s+'">'+em(n.e[0],n.e[1])+'<span><b>'+n.l+'</b><small>'+n.s+'</small></span></button>'});
const nodes=[...document.querySelectorAll('.node')];
function start(){mistakes=0;miss={};endEl.classList.add('hide');fb.classList.remove('hide');document.querySelector('.map').classList.remove('hide');startLeg(0)}
function startLeg(l){
  leg=l;step=1;count=1;busy=false;
  const L=LEGS[l];
  $('#leg').innerHTML=em(L.e[0],L.e[1])+L.t;
  nodes.forEach(b=>{b.classList.remove('on');const n=b.querySelector('.n');if(n)n.remove()});
  mark(L.path[0]);
  trail();
  say(fb,'It starts at '+N[L.path[0]].l+'. Tap the next stop.');
}
function mark(k){
  const b=nodes.find(x=>x.dataset.k===k);b.classList.add('on');
  const old=b.querySelector('.n');if(old)old.textContent+=' · '+count;else b.insertAdjacentHTML('beforeend','<span class="n">'+count+'</span>');
  count++;
}
function trail(){$('#trail').textContent=LEGS[leg].path.slice(0,step).map(k=>N[k].l).join(' → ')}
function tap(k){
  if(busy)return;
  const L=LEGS[leg],want=L.path[step];
  if(k===want){
    mark(k);step++;trail();
    say(fb,'✓ '+L.why[k],'ok');
    if(step===L.path.length){
      busy=true;
      if(leg===0){$('#fb').textContent+=' Trip 2 starting…';setTimeout(()=>startLeg(1),2600)}
      else setTimeout(finish,2600);
    }
  }else{
    const b=nodes.find(x=>x.dataset.k===k);
    if(!miss[leg+'-'+step]){miss[leg+'-'+step]=1;mistakes++}
    b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);
    say(fb,'✗ '+wrong(leg,k),'bad');
  }
}
function finish(){
  const total=LEGS[0].path.length-1+LEGS[1].path.length-1;
  document.querySelector('.map').classList.add('hide');$('#trail').textContent='';$('#leg').innerHTML='';
  fb.classList.add('hide');endEl.classList.remove('hide');
  endEl.innerHTML=em('Party popper','🎉')+'<h2>Both packets arrived!</h2><div class="score">Score: '+(total-mistakes)+' / '+total+' stops right on the first try</div><p class="take">Visitors only come in to the ALB. The API only goes out, through the NAT.</p><button class="btn" id="again">Play again</button>';
  $('#again').onclick=start;$('#again').focus();
}
document.querySelector('.map').addEventListener('click',e=>{const b=e.target.closest('.node');if(b)tap(b.dataset.k)});
start();
</script>
</body>
</html>
