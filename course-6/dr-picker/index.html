<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pick a disaster plan</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#FFF4EE;color:#3A2A24;font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:10px}
.wrap{max-width:700px;margin:0 auto}
.hero{background:linear-gradient(135deg,#FFB59C,#F27E5E);color:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(242,126,94,.3)}
.hero h1{font-size:19px;margin:0;font-weight:800;line-height:1.15}
.hero p{margin:2px 0 0;font-weight:700;font-size:14px;line-height:1.25}
.hero .em{width:42px;height:42px;flex:none}
.em{width:28px;height:28px;object-fit:contain;vertical-align:middle;flex:none}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(120,60,40,.1);padding:12px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid #3A2A24;outline-offset:2px}
.btn{background:linear-gradient(135deg,#F58D6F,#DF5F3F);color:#fff;font-weight:800;border:0;border-radius:14px;padding:0 20px;box-shadow:0 3px 8px rgba(223,95,63,.35)}
.btn.ghost{background:#fff;color:#3A2A24;box-shadow:inset 0 0 0 2px #F0CDBE}
.btn:disabled{opacity:.45;cursor:default}
.fb{min-height:44px;margin:8px 0 0;padding:8px 12px;border-radius:12px;background:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(120,60,40,.08)}
.fb.ok{background:#E6F6EC;box-shadow:inset 0 0 0 2px #3BAA6E}
.fb.bad{background:#FDECEA;box-shadow:inset 0 0 0 2px #E5534B}
.end{text-align:center;margin-top:10px}
.end h2{margin:0 0 4px;font-size:22px}
.end .score{font-size:18px;font-weight:800;margin:4px 0 6px}
.end .take{font-weight:700;margin:0 0 10px}
.end .em{width:56px;height:56px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.biz{display:flex;gap:12px;align-items:center;margin-top:10px}
.biz .em{width:52px;height:52px}
.biz h2{margin:0;font-size:18px}
.biz p{margin:2px 0 0;font-size:14px}
.needs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.need{background:#FFF0E8;border-radius:10px;padding:4px 10px;font-size:13px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{background:#FFFAF7;border:2px solid #F2DDD3;border-radius:14px;padding:6px 10px;text-align:left;display:flex;flex-direction:column;gap:1px}
.opt b{font-size:15px}
.opt small{font-size:12px;opacity:.85}
.opt:hover:not(:disabled){border-color:#F27E5E}
.opt.right{background:#DDF3E6;border-color:#3BAA6E}
.opt.wrong{background:#FBDAD7;border-color:#E5534B}
.opt:disabled{cursor:default;color:inherit}
.tag{font-size:13px;opacity:.75}
.go{margin-top:8px}
.rule{font-size:13px;margin-top:6px;opacity:.8}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span id="heroEm"></span><div><h1>Pick a disaster plan</h1><p>Each business can lose a region. Pick the cheapest plan that still meets its RPO and RTO.</p></div></div>
  <div class="card" style="margin-top:10px" id="card"></div>
  <div class="rule">RPO = how much data you accept losing. RTO = how long you accept being down.</div>
  <div id="fb" class="fb" role="status" aria-live="polite"></div>
  <div id="end" class="end card hide"></div>
</div>
<script>
const EB='https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/';
function em(name,chr,cls){
  const u=EB+encodeURIComponent(name)+'/3D/'+name.toLowerCase().replace(/ /g,'_')+'_3d.png';
  return '<img class="em '+(cls||'')+'" src="'+u+'" alt="'+chr+'" aria-hidden="true" onerror="this.replaceWith(document.createTextNode(this.alt))">';
}
const $=s=>document.querySelector(s);
function say(msg,kind){const f=$('#fb');f.className='fb '+(kind||'');f.textContent=msg}
$('#heroEm').innerHTML=em('Ring buoy','🛟');

const PLANS=[
 {k:'br',n:'Backup and restore',d:'Nothing runs, only backups',rpo:'hours',rto:'hours to a day',c:'$',lvl:0},
 {k:'pl',n:'Pilot light',d:'Data copied, DB on, app off',rpo:'minutes',rto:'tens of min to hours',c:'$$',lvl:1},
 {k:'ws',n:'Warm standby',d:'Small full copy, scaled up',rpo:'seconds to minutes',rto:'minutes',c:'$$$',lvl:2},
 {k:'ms',n:'Multi-site',d:'Full stack live in both',rpo:'near zero',rto:'near zero',c:'$$$$',lvl:3}
];
const BIZ=[
 {e:['Newspaper','📰'],n:'A student club blog',d:'Posts once a week. Nobody reads it at night.',rpo:'a day of posts',rto:'a day',a:0,
  why:'Losing hours of data and a day offline is fine here: backups only, the cheapest plan.'},
 {e:['Graduation cap','🎓'],n:'A school homework portal',d:'Students upload work all day.',rpo:'15 minutes of uploads',rto:'2 hours',a:1,
  why:'Minutes of data loss and a couple of hours back: pilot light, data copied and the database already running.'},
 {e:['Shopping cart','🛒'],n:'An online shop',d:'Every minute down means lost orders.',rpo:'1 minute of orders',rto:'10 minutes',a:2,
  why:'Back in minutes with seconds of data lost: warm standby, a small full copy ready to scale up.'},
 {e:['Credit card','💳'],n:'A card payment service',d:'Payments must never be lost or stop.',rpo:'zero',rto:'zero',a:3,
  why:'Near zero on both counts means the full stack serving traffic in both places: multi-site.'}
];
let i,score;
function start(){i=0;score=0;$('#end').classList.add('hide');$('#fb').classList.remove('hide');$('#card').classList.remove('hide');show()}
function show(){
  const b=BIZ[i];
  $('#card').innerHTML='<div class="tag">Business '+(i+1)+' of '+BIZ.length+'</div><div class="biz">'+em(b.e[0],b.e[1])+'<div><h2>'+b.n+'</h2><p>'+b.d+'</p></div></div>'+
   '<div class="needs"><span class="need">RPO: lose at most '+b.rpo+'</span><span class="need">RTO: back within '+b.rto+'</span></div>'+
   '<div class="opts">'+PLANS.map(p=>'<button class="opt" data-l="'+p.lvl+'"><b>'+p.n+' '+p.c+'</b><small>'+p.d+'</small><small>RPO '+p.rpo+' · RTO '+p.rto+'</small></button>').join('')+'</div><div class="go" id="nx"></div>';
  say('Pick the cheapest plan that fits.');
  $('#card').querySelectorAll('.opt').forEach(o=>o.onclick=()=>pick(+o.dataset.l,o));
}
function pick(l,btn){
  const b=BIZ[i],ok=l===b.a;if(ok)score++;
  $('#card').querySelectorAll('.opt').forEach(o=>{o.disabled=true;
    if(+o.dataset.l===b.a){o.classList.add('right');o.querySelector('b').textContent='✓ '+o.querySelector('b').textContent}
    else if(o===btn){o.classList.add('wrong');o.querySelector('b').textContent='✗ '+o.querySelector('b').textContent}});
  let msg;
  if(ok)msg='✓ Yes! '+b.why;
  else if(l>b.a)msg='✗ It works, but you pay for more than you need. '+b.why;
  else msg='✗ Too slow or too lossy for this business. '+b.why;
  say(msg,ok?'ok':'bad');
  $('#nx').innerHTML='<button class="btn" id="n">'+(i<BIZ.length-1?'Next business':'See my score')+'</button>';
  $('#n').focus({preventScroll:true});
  $('#n').onclick=()=>{i++;i<BIZ.length?show():end()};
}
function end(){
  $('#card').classList.add('hide');$('#fb').classList.add('hide');
  const e=$('#end');e.classList.remove('hide');
  e.innerHTML=em(score===4?'Trophy':'Thinking face',score===4?'🏆':'🤔')+'<h2>Disasters planned!</h2><div class="score">Score: '+score+' / 4 businesses covered</div><p class="take">Smaller RPO and RTO always cost more. Pay only for what the business needs.</p><button class="btn" id="again">Play again</button>';
  $('#again').onclick=start;$('#again').focus();
}
start();
</script>
</body>
</html>
