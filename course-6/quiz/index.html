<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IaC, CI/CD and FinOps quiz</title>
<style>
*{box-sizing:border-box}
:root{--bg:#FFF4EE;--ink:#3A2A24;--ok:#3BAA6E;--bad:#E5534B;--soft:0 4px 16px rgba(120,60,40,.10)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.35;padding:10px;max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #3A2A24;outline-offset:2px}
.hero{background:linear-gradient(135deg,#FFB59C,#F27E5E);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--soft)}
.hero h1{margin:0;font-size:19px;font-weight:800}
.hero p{margin:2px 0 0;font-weight:600;font-size:14px}
.card{background:#fff;border-radius:16px;box-shadow:var(--soft);padding:14px;margin-top:10px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:10px}
.dot{width:12px;height:12px;border-radius:50%;background:#F2DDD3}
.dot.on{background:#F27E5E;transform:scale(1.2)}.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}
.tag{font-size:12px;font-weight:700;color:#C4583B;text-transform:uppercase;letter-spacing:.04em}
.qrow{display:flex;gap:12px;align-items:center;margin:6px 0 10px}
.qrow img{width:52px;height:52px;flex:none}
.q{font-size:18px;font-weight:800;margin:0}
.opts{display:grid;gap:8px}
.opt{min-height:48px;text-align:left;background:#FFFAF7;border:2px solid #F2DDD3;border-radius:14px;padding:8px 12px;font-weight:600;display:flex;gap:8px;align-items:center}
.opt:hover:not(:disabled){border-color:#F27E5E;background:#FFF0E8}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.opt.right{background:#DDF3E6;border-color:var(--ok)}.opt.right .mk{color:var(--ok)}
.opt.wrong{background:#FBDAD7;border-color:var(--bad)}.opt.wrong .mk{color:var(--bad)}
.opt:disabled{cursor:default;color:inherit}
.fb{margin:10px 0 0;font-weight:700;min-height:2.7em}
.fb.ok{color:#23814f}.fb.no{color:#C0392F}
.btn{min-height:44px;border:0;border-radius:14px;background:linear-gradient(135deg,#FFB59C,#F27E5E);color:#fff;font-weight:800;padding:0 20px;box-shadow:var(--soft)}
.center{text-align:center}.big{font-size:40px;font-weight:900;margin:0}
.hide{display:none!important}#nx{margin-top:8px}
</style>
</head>
<body>
<div class="hero"><h1>IaC, CI/CD and FinOps quiz</h1><p id="goal">8 questions. Pick the best answer.</p></div>
<div class="card" id="card" aria-live="polite"></div>
<div class="dots" id="dots" aria-hidden="true"></div>
<script>
const IMG=(n,f)=>`https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/${n}/3D/${f}_3d.png`;
const Q=[
 {img:IMG("Shortcake","shortcake"),t:"In CloudFormation, the template is the recipe. What is the stack?",
  o:["A backup of the template","The real resources built from the template, managed as one block","The YAML file in your Git repository"],a:1,
  why:"The template is the recipe, the stack is the cake. Delete the stack and its resources go, in the right order."},
 {img:IMG("Globe%20with%20meridians","globe_with_meridians"),t:"Your setup mixes AWS, DNS, monitoring and SaaS tools. Which tool fits best?",
  o:["Terraform","CloudFormation","A bash script with aws commands"],a:0,
  why:"Terraform speaks to almost every cloud and online tool. CloudFormation only speaks AWS."},
 {img:IMG("File%20cabinet","file_cabinet"),t:"The change set shows your RDS database with Replacement: True. What does that mean?",
  o:["A quick in-place tweak","A new, empty database replaces the old one","AWS takes a snapshot for you"],a:1,
  why:"Replacement deletes the resource and builds a new one. Read that column before you execute."},
 {img:IMG("Pencil","pencil"),t:"A teammate opens port 22 on puff-api-sg from the console. What does CloudFormation call this?",
  o:["Rollback","A change set","Drift"],a:2,
  why:"Reality no longer matches the template, that's drift. The next update may undo the fix or fail on it."},
 {img:IMG("Package","package"),t:"Your pipeline tested image abc123 on staging. What goes to production?",
  o:["The same image abc123","A fresh build of the same commit","The latest image on your laptop"],a:0,
  why:"Build once, promote the same image everywhere. A rebuild means production runs something you never tested."},
 {img:IMG("Blue%20circle","blue_circle"),t:"Which strategy gives you a way back in seconds but doubles your servers for a while?",
  o:["Rolling","Blue/green","Canary"],a:1,
  why:"Blue/green keeps the old fleet alive next to the new one. Going back is one listener flip."},
 {img:IMG("Sleeping%20face","sleeping_face"),t:"A test stack with a NAT gateway sits there all weekend with zero visitors. What do you pay?",
  o:["Nothing, there's no traffic","Only for the data that went through it","The hourly price, all weekend"],a:2,
  why:"A NAT gateway, a load balancer or a database costs the same with zero visitors. Delete idle stacks."},
 {img:IMG("Ring%20buoy","ring_buoy"),t:"What is RPO?",
  o:["How much data you accept losing, counted in time","How long you accept being down","How much the backup region costs"],a:0,
  why:"RPO is data you can lose, RTO is time you can be down. Smaller numbers always cost more."}
];
const $=s=>document.querySelector(s);
const card=$("#card"),dots=$("#dots"),goal=$("#goal");
let i,score,res,locked;
function drawDots(){dots.innerHTML=Q.map((_,k)=>`<span class="dot ${res[k]===undefined?(k===i?"on":""):(res[k]?"ok":"no")}"></span>`).join("")}
function start(){i=0;score=0;res=[];goal.textContent="8 questions. Pick the best answer.";dots.classList.remove("hide");show()}
function show(){
  locked=false;drawDots();
  const c=Q[i];
  card.innerHTML=`<div class="tag">Question ${i+1} of ${Q.length}</div>
   <div class="qrow"><img src="${c.img}" alt="" onerror="this.style.display='none'"><p class="q">${c.t}</p></div>
   <div class="opts">${c.o.map((x,k)=>`<button class="opt" data-k="${k}"><span>${x}</span><span class="mk"></span></button>`).join("")}</div>
   <p class="fb" id="fb"></p><div id="nx"></div>`;
  card.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function pick(k){
  if(locked)return;locked=true;
  const c=Q[i],ok=k===c.a;
  if(ok)score++;res[i]=ok;drawDots();
  card.querySelectorAll(".opt").forEach((b,n)=>{
    b.disabled=true;
    if(n===c.a){b.classList.add("right");b.querySelector(".mk").textContent="✓"}
    else if(n===k){b.classList.add("wrong");b.querySelector(".mk").textContent="✗"}
  });
  const fb=$("#fb");fb.className="fb "+(ok?"ok":"no");
  fb.textContent=`${ok?"✓ Yes!":"✗ Not quite."} ${c.why}`;
  $("#nx").innerHTML=`<button class="btn" id="n">${i<Q.length-1?"Next":"See my score"}</button>`;
  $("#n").focus({preventScroll:true});
  $("#n").onclick=()=>{i++;i<Q.length?show():end()};
}
function end(){
  dots.classList.add("hide");goal.textContent="All done!";
  const band=score===8?["Trophy","trophy","Perfect! Your Puff is ready for its customer."]
   :score>=6?["Party%20popper","party_popper","Great job! Just a couple of ideas to re-read."]
   :score>=4?["Thinking%20face","thinking_face","Not bad, read the page again and replay."]
   :["Seedling","seedling","Good start, read the page again and try one more time."];
  card.innerHTML=`<div class="center"><img src="${IMG(band[0],band[1])}" width="72" height="72" alt="" onerror="this.style.display='none'">
   <p class="big">${score}/8</p><p class="fb ${score>=6?"ok":""}">${band[2]}</p>
   <button class="btn" id="again">Play again</button></div>`;
  $("#again").onclick=start;$("#again").focus({preventScroll:true});
}
start();
</script>
</body>
</html>
