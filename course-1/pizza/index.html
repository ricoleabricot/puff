<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pizza sorter: IaaS, PaaS, SaaS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#FFF4EE;color:#3A2A24;font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:10px}
.wrap{max-width:700px;margin:0 auto}
.hero{background:linear-gradient(135deg,#FFB59C,#F27E5E);color:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(242,126,94,.3)}
.hero h1{font-size:19px;margin:0;font-weight:800;line-height:1.15}
.hero p{margin:2px 0 0;font-weight:700;font-size:14px;line-height:1.25}
.hero .em{width:42px;height:42px;flex:none}
.em{width:28px;height:28px;object-fit:contain;vertical-align:middle;flex:none}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(120,60,40,.1);padding:12px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #3A2A24;outline-offset:2px}
.btn{background:linear-gradient(135deg,#F58D6F,#DF5F3F);color:#fff;font-weight:800;border:0;border-radius:14px;padding:0 20px;box-shadow:0 3px 8px rgba(223,95,63,.35)}
.btn.ghost{background:#fff;color:#3A2A24;box-shadow:inset 0 0 0 2px #F0CDBE}
.btn:disabled{opacity:.45;cursor:default}
.fb{min-height:44px;margin:8px 0 0;padding:8px 12px;border-radius:12px;background:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(120,60,40,.08)}
.fb.ok{background:#E6F6EC;box-shadow:inset 0 0 0 2px #3BAA6E}
.fb.bad{background:#FDECEA;box-shadow:inset 0 0 0 2px #E5534B}
.ok-c{color:#237A4B}.bad-c{color:#C23B33}
.end{text-align:center;margin-top:10px}
.end h2{margin:0 0 4px;font-size:22px}
.end .score{font-size:18px;font-weight:800;margin:4px 0 6px}
.end .take{font-weight:700;margin:0 0 10px}
.end .em{width:56px;height:56px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.plate{background:#fff;border:0;border-radius:16px;box-shadow:0 4px 14px rgba(120,60,40,.1),inset 0 0 0 2px #F6DCCF;padding:8px 6px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .15s,box-shadow .15s}
.plate .em{width:44px;height:44px}
.plate b{font-size:15px;line-height:1.1}
.plate small{font-size:12px;opacity:.8;line-height:1.2}
.plate.hot{transform:translateY(-2px);box-shadow:0 6px 16px rgba(242,126,94,.35),inset 0 0 0 3px #F27E5E}
.plate .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:4px}
.got span{background:#E6F6EC;color:#237A4B;border-radius:10px;padding:2px 7px;font-size:12px;font-weight:700}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.item{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border:0;border-radius:16px;box-shadow:0 3px 10px rgba(120,60,40,.14);padding:4px 12px 4px 8px;display:flex;align-items:center;gap:6px;font-weight:700;min-width:104px;cursor:grab}
.item.sel{box-shadow:0 0 0 3px #F27E5E,0 4px 12px rgba(242,126,94,.4);transform:translateY(-2px)}
.item.shake{animation:shake .35s}
.item.miss::after{content:"\2717";color:#E5534B;font-weight:800;margin-left:2px}
.item .em{pointer-events:none;-webkit-user-drag:none}
.ghost{position:fixed;z-index:9;pointer-events:none;opacity:.92;transform:rotate(-4deg) scale(1.05)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.count{font-size:13px;text-align:center;margin-top:6px;opacity:.75}
@media (max-width:420px){.plate{min-height:136px}.plate b{font-size:14px}.item{min-width:0;flex:1 1 44%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span id="heroEm"></span><div><h1>Pizza sorter</h1><p>Drag each service to the pizza that matches how much work you keep. Or tap a card, then tap a plate.</p></div></div>
  <div class="plates" id="plates"></div>
  <div class="count" id="count"></div>
  <div class="tray" id="tray" aria-label="Services to sort"></div>
  <div id="fb" class="fb" role="status" aria-live="polite">Pick a card to start.</div>
  <div id="end" class="end card hide"></div>
</div>
<script>
const EB='https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/';
function em(name,chr,cls){
  const u=EB+encodeURIComponent(name)+'/3D/'+name.toLowerCase().replace(/ /g,'_')+'_3d.png';
  return '<img class="em '+(cls||'')+'" src="'+u+'" alt="'+chr+'" aria-hidden="true" onerror="this.replaceWith(document.createTextNode(this.alt))">';
}
const $=s=>document.querySelector(s);
function say(el,msg,kind){el.className='fb '+(kind||'');el.textContent=msg}

const PLATES=[
 {k:'IaaS',t:'Homemade',s:'You make the dough',e:['Cooking','🍳']},
 {k:'PaaS',t:'Frozen, you bake',s:'You just bake it',e:['Snowflake','❄️']},
 {k:'SaaS',t:'Delivered',s:'You just eat',e:['Motorcycle','🏍️']}
];
const ITEMS=[
 {id:'EC2',k:'IaaS',e:['Laptop','💻'],l:'EC2 is IaaS: AWS runs the hardware, you manage the OS, runtime, app and data.'},
 {id:'EBS',k:'IaaS',e:['Floppy disk','💾'],l:'EBS is IaaS: AWS runs the disks, you manage the OS, app and data on them.'},
 {id:'RDS',k:'PaaS',e:['File cabinet','🗄️'],l:'RDS is PaaS: AWS installs and updates PostgreSQL and takes backups, you only own the tables and data.'},
 {id:'Lambda',k:'PaaS',e:['High voltage','⚡'],l:'Lambda is PaaS: AWS handles the OS and runtime, you bring your code and data.'},
 {id:'Heroku',k:'PaaS',e:['Rocket','🚀'],l:'Heroku is PaaS: it handles the OS, updates and runtime, you push your app and data.'},
 {id:'Gmail',k:'SaaS',e:['Incoming envelope','📨'],l:'Gmail is SaaS: you only bring your data and settings.'},
 {id:'Slack',k:'SaaS',e:['Speech balloon','💬'],l:'Slack is SaaS: the provider runs everything, you only bring your data and settings.'},
 {id:'Amazon WorkMail',k:'SaaS',e:['Briefcase','💼'],l:'Amazon WorkMail is SaaS: AWS runs everything, you only bring your data and settings.'}
];
let sel,missed,placed,drag,suppress;
const platesEl=$('#plates'),tray=$('#tray'),fb=$('#fb'),endEl=$('#end');
$('#heroEm').innerHTML=em('Pizza','🍕');
function start(){
  sel=null;missed={};placed={};drag=null;suppress=false;
  endEl.classList.add('hide');
  platesEl.innerHTML=PLATES.map(p=>'<button class="plate" data-k="'+p.k+'" aria-label="'+p.t+' pizza, '+p.k+'">'+em(p.e[0],p.e[1])+'<b>'+p.k+'</b><small>'+p.t+'<br>'+p.s+'</small><span class="got"></span></button>').join('');
  tray.innerHTML=[...ITEMS].sort(()=>Math.random()-.5).map(i=>'<button class="item" data-id="'+i.id+'">'+em(i.e[0],i.e[1])+i.id.replace('Amazon ','')+'</button>').join('');
  say(fb,'Pick a card to start.');
  upd();
}
function upd(){$('#count').textContent=Object.keys(placed).length+' of '+ITEMS.length+' sorted';}
function selectItem(id){
  sel=sel===id?null:id;
  tray.querySelectorAll('.item').forEach(b=>b.classList.toggle('sel',b.dataset.id===sel));
  if(sel)say(fb,'Now tap the plate for '+sel+'.');
}
function place(id,k){
  const it=ITEMS.find(i=>i.id===id),btn=tray.querySelector('[data-id="'+CSS.escape(id)+'"]');
  if(!it||!btn)return;
  if(it.k===k){
    placed[id]=1;btn.remove();sel=null;
    const g=platesEl.querySelector('[data-k="'+k+'"] .got');
    g.insertAdjacentHTML('beforeend','<span>✓ '+id.replace('Amazon ','')+'</span>');
    say(fb,'✓ Yes! '+it.l,'ok');upd();
    if(Object.keys(placed).length===ITEMS.length)finish();
  }else{
    missed[id]=1;btn.classList.add('miss','shake');btn.classList.remove('sel');sel=null;
    setTimeout(()=>btn.classList.remove('shake'),400);
    say(fb,'✗ Not there. '+it.l,'bad');
  }
}
function finish(){
  const n=ITEMS.length-Object.keys(missed).length;
  fb.classList.add('hide');
  endEl.classList.remove('hide');
  endEl.innerHTML=em('Party popper','🎉')+'<h2>All sorted!</h2><div class="score">Score: '+n+' / '+ITEMS.length+' on the first try</div><p class="take">Moving right means less work and less control.</p><button class="btn" id="again">Play again</button>';
  $('#again').onclick=()=>{fb.classList.remove('hide');start()};
  $('#again').focus();
}
tray.addEventListener('click',e=>{
  const b=e.target.closest('.item');if(!b)return;
  if(suppress){suppress=false;return}
  selectItem(b.dataset.id);
});
platesEl.addEventListener('click',e=>{
  const p=e.target.closest('.plate');if(!p)return;
  if(sel)place(sel,p.dataset.k);else say(fb,'Pick a card first, then tap a plate.');
});
tray.addEventListener('dragstart',e=>e.preventDefault());
tray.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.item');if(!b||e.button>0)return;
  drag={id:b.dataset.id,b,x:e.clientX,y:e.clientY,g:null};
});
function plateAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('.plate')}
document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.g){
    if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;
    const r=drag.b.getBoundingClientRect(),g=drag.b.cloneNode(true);
    g.className='item ghost';g.style.width=r.width+'px';
    document.body.appendChild(g);drag.g=g;drag.dx=drag.x-r.left;drag.dy=drag.y-r.top;
    drag.b.style.opacity='.35';
  }
  drag.g.style.left=(e.clientX-drag.dx)+'px';drag.g.style.top=(e.clientY-drag.dy)+'px';
  const p=plateAt(e.clientX,e.clientY);
  platesEl.querySelectorAll('.plate').forEach(x=>x.classList.toggle('hot',x===p));
});
function endDrag(e,drop){
  if(!drag)return;
  const d=drag;drag=null;
  platesEl.querySelectorAll('.plate').forEach(x=>x.classList.remove('hot'));
  if(!d.g)return;
  d.g.remove();d.b.style.opacity='';suppress=true;setTimeout(()=>suppress=false,0);
  const p=drop&&plateAt(e.clientX,e.clientY);
  if(p)place(d.id,p.dataset.k);
}
document.addEventListener('pointerup',e=>endDrag(e,true));
document.addEventListener('pointercancel',e=>endDrag(e,false));
start();
</script>
</body>
</html>
