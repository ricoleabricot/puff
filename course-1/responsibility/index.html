<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who owns what on AWS?</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#FFF4EE;color:#3A2A24;font:15px/1.35 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:10px}
.wrap{max-width:700px;margin:0 auto}
.hero{background:linear-gradient(135deg,#FFB59C,#F27E5E);color:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(242,126,94,.3)}
.hero h1{font-size:19px;margin:0;font-weight:800;line-height:1.15}
.hero p{margin:2px 0 0;font-weight:700;font-size:14px;line-height:1.25}
.hero .em{width:42px;height:42px;flex:none}
.em{width:28px;height:28px;object-fit:contain;vertical-align:middle;flex:none}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 14px rgba(120,60,40,.1);padding:12px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid #3A2A24;outline-offset:2px}
.btn{background:linear-gradient(135deg,#F58D6F,#DF5F3F);color:#fff;font-weight:800;border:0;border-radius:14px;padding:0 20px;box-shadow:0 3px 8px rgba(223,95,63,.35)}
.btn.ghost{background:#fff;color:#3A2A24;box-shadow:inset 0 0 0 2px #F0CDBE}
.btn:disabled{opacity:.45;cursor:default}
.fb{min-height:44px;margin:8px 0 0;padding:8px 12px;border-radius:12px;background:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 2px 8px rgba(120,60,40,.08)}
.fb.ok{background:#E6F6EC;box-shadow:inset 0 0 0 2px #3BAA6E}
.fb.bad{background:#FDECEA;box-shadow:inset 0 0 0 2px #E5534B}
.ok-c{color:#237A4B}.bad-c{color:#C23B33}
.end{text-align:center;margin-top:10px}
.end h2{margin:0 0 4px;font-size:22px}
.end .score{font-size:18px;font-weight:800;margin:4px 0 6px}
.end .take{font-weight:700;margin:0 0 10px}
.end .em{width:56px;height:56px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tabs{display:flex;gap:6px;margin-top:10px}
.tabs button{flex:1;border:0;border-radius:14px;background:#FFE9DE;font-weight:800;padding:4px 6px;line-height:1.15}
.tabs button small{font-weight:600;font-size:11px;opacity:.75}
.tabs button small::before{content:" \00b7 "}
.tabs button[aria-selected=true]{background:#fff;color:#C94E30;box-shadow:0 3px 10px rgba(120,60,40,.18)}
.tabs button .dn{color:#237A4B}
.stack{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.layer{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:2px 6px 2px 10px;min-height:42px;box-shadow:0 2px 8px rgba(120,60,40,.1);border-left:8px solid #F0CDBE}
.layer .nm{flex:1;font-weight:700;font-size:14px;line-height:1.2;min-width:0}
.layer .nm small{display:block;font-weight:600;font-size:12px;opacity:.85}
.layer .g{display:flex;gap:4px;flex:none}
.layer .g button{border:0;border-radius:10px;min-width:56px;min-height:44px;background:#FFF4EE;font-weight:800;box-shadow:inset 0 0 0 2px #F0CDBE}
.layer .g button[aria-pressed=true]{background:#3A2A24;color:#fff;box-shadow:none}
.layer.aws{background:#E4E1DE;border-left-color:#8E8782}
.layer.you{background:#FFD9C6;border-left-color:#F27E5E}
.layer.na{background:#F1ECE9;border-left-color:#D9D1CC;opacity:.65;border-style:dashed}
.layer .res{flex:none;font-weight:800;font-size:13px;text-align:right}
.layer .res.r{color:#237A4B}.layer .res.w{color:#C23B33}
.bar{display:flex;gap:8px;margin-top:8px;align-items:center}
.bar .btn{flex:1}
.bar .sc{font-weight:800;font-size:14px;white-space:nowrap}
@media (max-width:420px){.layer .nm{font-size:13px}.layer .g button{min-width:48px;padding:0 6px}.tabs button small{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span id="heroEm"></span><div><h1>Who owns what on AWS?</h1><p>For each layer, guess who handles it, AWS or you, then reveal.</p></div></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="stack" id="stack"></div>
  <div class="bar"><button class="btn" id="reveal">Reveal</button><span class="sc" id="sc"></span></div>
  <div id="fb" class="fb" role="status" aria-live="polite">Guess every layer, then reveal.</div>
  <div id="end" class="end card hide"></div>
</div>
<script>
const EB='https://raw.githubusercontent.com/microsoft/fluentui-emoji/main/assets/';
function em(name,chr,cls){
  const u=EB+encodeURIComponent(name)+'/3D/'+name.toLowerCase().replace(/ /g,'_')+'_3d.png';
  return '<img class="em '+(cls||'')+'" src="'+u+'" alt="'+chr+'" aria-hidden="true" onerror="this.replaceWith(document.createTextNode(this.alt))">';
}
const $=s=>document.querySelector(s);
function say(el,msg,kind){el.className='fb '+(kind||'');el.textContent=msg}

$('#heroEm').innerHTML=em('Handshake','🤝');
// order: top of stack first. a = answer per service [EC2, RDS, S3], null = n/a
const LAYERS=[
 {n:'Encryption on or off, backups kept',e:['Locked','🔒'],a:['You','You','You'],note:['','','']},
 {n:'Who can access the data',s:'IAM, bucket policies',e:['Key','🔑'],a:['You','You','You'],note:['','','']},
 {n:'Firewall rules',s:'security groups',e:['Shield','🛡️'],a:['You','You',null],note:['','','']},
 {n:'Database software updates',e:['File cabinet','🗄️'],a:['You','AWS',null],note:['You, if you install one','AWS, in a time slot you pick','']},
 {n:'Operating system updates',e:['Hammer and wrench','🛠️'],a:['You','AWS','AWS'],note:['','','']},
 {n:'Buildings, hardware, network',e:['Cityscape','🏙️'],a:['AWS','AWS','AWS'],note:['','','']}
];
const SVC=[
 {k:'EC2',t:'EC2',s:'IaaS',own:'On EC2 you keep the operating system, the firewall, access and your data.'},
 {k:'RDS',t:'RDS',s:'managed',own:'On RDS, AWS updates the operating system and PostgreSQL, you keep the firewall, access and your data.'},
 {k:'S3',t:'S3',s:'managed storage',own:'On S3 you only own access, encryption, backups and your files.'}
];
let cur,guess,shown,tally;
const tabs=$('#tabs'),stack=$('#stack'),fb=$('#fb'),endEl=$('#end');
function start(){
  cur=0;guess=SVC.map(()=>({}));shown=SVC.map(()=>false);
  endEl.classList.add('hide');$('.bar').classList.remove('hide');fb.classList.remove('hide');
  say(fb,'Guess every layer, then reveal.');
  render();
}
function total(i){return LAYERS.filter(l=>l.a[i]).length}
function right(i){return LAYERS.filter(l=>l.a[i]&&guess[i][l.n]===l.a[i]).length}
function render(){
  tabs.innerHTML=SVC.map((s,i)=>'<button role="tab" data-i="'+i+'" aria-selected="'+(i===cur)+'"><b>'+(shown[i]?'<span class="dn">✓ </span>':'')+s.t+'</b><small>'+s.s+'</small></button>').join('');
  tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;say(fb,shown[cur]?SVC[cur].own:'Guess every layer, then reveal.',shown[cur]?'ok':'');render()});
  stack.innerHTML=LAYERS.map((l,li)=>{
    const a=l.a[cur],g=guess[cur][l.n],sh=shown[cur];
    let cls='layer',tail='';
    const label=l.n+(l.s?' ('+l.s+')':'');
    if(!a){
      cls+=' na';
      tail='<span class="res">Not used</span>';
      return '<div class="'+cls+'"><span>'+em(l.e[0],l.e[1])+'</span><div class="nm">'+l.n+(l.s?'<small>'+l.s+'</small>':'')+'</div>'+tail+'</div>';
    }
    if(sh){
      cls+=a==='AWS'?' aws':' you';
      const ok=g===a;
      tail='<span class="res '+(ok?'r':'w')+'">'+(g?(ok?'✓ ':'✗ '):'')+a+'</span>';
      const nt=l.note[cur];
      return '<div class="'+cls+'"><span>'+em(l.e[0],l.e[1])+'</span><div class="nm">'+l.n+(l.s?'<small>'+l.s+'</small>':'')+(nt?'<small>'+nt+'</small>':'')+'</div>'+tail+'</div>';
    }
    tail='<div class="g" role="group" aria-label="'+label+'">'+['AWS','You'].map(v=>'<button data-li="'+li+'" data-v="'+v+'" aria-pressed="'+(g===v)+'">'+v+'</button>').join('')+'</div>';
    return '<div class="'+cls+'"><span>'+em(l.e[0],l.e[1])+'</span><div class="nm">'+l.n+(l.s?'<small>'+l.s+'</small>':'')+'</div>'+tail+'</div>';
  }).join('');
  stack.querySelectorAll('.g button').forEach(b=>b.onclick=()=>{
    guess[cur][LAYERS[+b.dataset.li].n]=b.dataset.v;render();
    const nb=stack.querySelector('[data-li="'+b.dataset.li+'"][data-v="'+b.dataset.v+'"]');nb&&nb.focus();
  });
  const done=shown.every(Boolean);
  const r=$('#reveal');
  r.textContent=shown[cur]?(done?'Final score':'Next service'):'Reveal';
  r.disabled=false;
  const pts=SVC.reduce((n,s,i)=>n+(shown[i]?right(i):0),0),max=SVC.reduce((n,s,i)=>n+(shown[i]?total(i):0),0);
  $('#sc').textContent=max?'Score: '+pts+' / '+max:'';
}
$('#reveal').onclick=()=>{
  if(shown[cur]){
    const nx=shown.findIndex(x=>!x);
    if(nx<0)return finish();
    cur=nx;say(fb,'Guess every layer, then reveal.');render();return;
  }
  const miss=LAYERS.filter(l=>l.a[cur]&&!guess[cur][l.n]).length;
  if(miss){say(fb,'Tap AWS or You on '+miss+' more layer'+(miss>1?'s':'')+' first.','bad');return}
  shown[cur]=true;
  const r=right(cur),t=total(cur);
  say(fb,(r===t?'✓ Perfect! ':r>=t/2?'✓ '+r+' of '+t+'. ':'✗ '+r+' of '+t+'. ')+SVC[cur].own,r>=t/2?'ok':'bad');
  render();
};
function finish(){
  const pts=SVC.reduce((n,s,i)=>n+right(i),0),max=SVC.reduce((n,s,i)=>n+total(i),0);
  fb.classList.add('hide');$('.bar').classList.add('hide');
  endEl.classList.remove('hide');
  endEl.innerHTML=em('Trophy','🏆')+'<h2>All done!</h2><div class="score">Score: '+pts+' / '+max+'</div><p class="take">The more managed the service, the less you own, but you always own identity, access and your data.</p><button class="btn" id="again">Play again</button>';
  $('#again').onclick=start;$('#again').focus();
}
start();
</script>
</body>
</html>
